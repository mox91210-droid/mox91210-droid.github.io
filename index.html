<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target $100 Gift Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo {
            width: 150px;
            margin-bottom: 20px;
        }
        h1 {
            color: #CC0000;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .gift-card {
            width: 100%;
            max-width: 300px;
            margin: 20px 0;
        }
        .claim-btn {
            display: block;
            width: 90%;
            margin: 30px auto;
            padding: 20px;
            background: linear-gradient(135deg, #00C851 0%, #007E33 100%);
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,200,81,0.3);
        }
        .claim-btn:active {
            transform: scale(0.95);
        }
        .info {
            font-size: 14px;
            color: #888;
            margin-top: 20px;
        }
        .steps {
            text-align: left;
            margin: 20px 0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Target_Corporation_logo_%282020%29.svg" class="logo" alt="Target">
        
        <h1>🎉 CONGRATULATIONS! 🎉</h1>
        <p class="subtitle">You have been selected to receive a</p>
        
        <img src="https://pngimg.com/uploads/target_PNG21.png" class="gift-card" alt="$100 Gift Card">
        
        <h2>$100 TARGET GIFT CARD</h2>
        
        <div class="steps">
            <p><b>To claim your reward:</b></p>
            <p>1. Click the button below</p>
            <p>2. Complete 1-2 sponsor offers</p>
            <p>3. Get your $100 Gift Card via email</p>
        </div>

        <a href="https://appcomplete.org/cl/i/xpl33g" class="claim-btn">
            CLAIM $100 NOW →
        </a>
        
        <p class="info">
            *Limited time offer. Only 100 gift cards available.
        </p>
    </div>
</body>
</html>
